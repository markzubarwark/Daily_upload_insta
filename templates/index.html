<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insta Auto Bot 🚀</title>
    <style>
        /* Google Font Import */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Instagram जैसा Colorful Background */
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: 600;
        }

        h2 span {
            background: -webkit-linear-gradient(#f09433, #bc1888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"],
        input[type="file"],
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e1e1;
            border-radius: 10px;
            font-size: 14px;
            transition: 0.3s;
            background: #f9f9f9;
        }

        textarea {
            resize: none;
        }

        input:focus, textarea:focus {
            border-color: #bc1888;
            background: #fff;
            outline: none;
            box-shadow: 0 0 8px rgba(188, 24, 136, 0.2);
        }

        /* File Input Styling */
        input[type="file"] {
            padding: 10px;
            background: #fff;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            background: linear-gradient(to right, #833ab4, #fd1d1d, #fcb045);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(253, 29, 29, 0.4);
        }

        button:active {
            transform: scale(0.98);
        }

        .msg {
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: none; /* Hidden by default */
        }
        
        /* Show message if content exists */
        .msg:not(:empty) {
            display: block;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="msg">{{ message }}</div>

        <h2>Auto <span>Poster</span></h2>
        <p class="subtitle">Upload once, post daily automatically.</p>
        
        <form method="POST" enctype="multipart/form-data">
            
            <div class="form-group">
                <label>👤 Instagram Username</label>
                <input type="text" name="username" required placeholder="Ex: my_insta_page">
            </div>
            
            <div class="form-group">
                <label>🔒 Password</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            
            <div class="form-group">
                <label>📝 Hashtags & Caption</label>
                <textarea name="hashtags" rows="3" placeholder="#viral #trending #daily"></textarea>
            </div>
            
            <div class="form-group">
                <label>🎥 Select Video (MP4)</label>
                <input type="file" name="video" accept="video/mp4" required>
            </div>
            
            <button type="submit">Start Automation 🚀</button>
        </form>

        <div class="footer">
            System runs 24/7 • Secure & Private
        </div>
    </div>

</body>
</html>
